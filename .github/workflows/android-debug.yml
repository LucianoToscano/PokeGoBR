name: Build PokeGoBR APK Debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokegobr-scanner-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Disponibilizar fonte editável
        uses: actions/upload-artifact@v4
        with:
          name: PokeGoBR-v0.0.2-scanner-fonte
          path: source/PokeGoBR-v0.0.2-SCANNER-FONTE.zip
          if-no-files-found: error
          retention-days: 30
      - name: Verificar e extrair fonte Android
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=source/PokeGoBR-v0.0.2-SCANNER-FONTE.zip
          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE" | tail -n 2
          cp README.md /tmp/pokegobr-current-readme.md
          unzip -oq "$ARCHIVE" -d .
          cp /tmp/pokegobr-current-readme.md README.md
          test -f settings.gradle.kts -o -f settings.gradle
          test -f gradlew
          test -d app/src/main
          python3 patches/scanner_v003.py
          python3 patches/scanner_v004.py
          python3 patches/scanner_v005.py
          python3 patches/scanner_v006.py
          python3 patches/scanner_v007.py
          # O seletor deve manter a escolha do app ou da tela inteira.
          grep -F 'val request = projectionManager.createScreenCaptureIntent()' app/src/main/java/br/com/pokegobr/MainActivity.kt
          if grep -F 'MediaProjectionConfig.createConfigForDefaultDisplay()' app/src/main/java/br/com/pokegobr/MainActivity.kt; then
            echo 'ERRO: captura restrita a tela inteira' >&2
            exit 1
          fi
          grep -F 'versionName = "0.0.7"' app/build.gradle.kts
          mkdir -p dist
          zip -qr dist/PokeGoBR-v0.0.7-FONTE-EDITAVEL.zip app/src app/build.gradle.kts build.gradle.kts gradlew gradle settings.gradle.kts gradle.properties README.md
      - name: Fonte editavel 0.0.7 corrigida
        uses: actions/upload-artifact@v4
        with:
          name: PokeGoBR-v0.0.7-scanner-fonte
          path: dist/PokeGoBR-v0.0.7-FONTE-EDITAVEL.zip
          if-no-files-found: error
          retention-days: 30
      - name: Testar detector V2 (fixtures sintéticas)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy pillow
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar e testar APK debug
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PokeGoBR-v0.0.7-scanner-alpha.apk
          sha256sum dist/PokeGoBR-v0.0.7-scanner-alpha.apk > dist/SHA256SUMS.txt
      - name: Disponibilizar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: PokeGoBR-v0.0.7-scanner-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK de testes no Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.0.7-scanner-alpha-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/PokeGoBR-v0.0.7-scanner-alpha.apk dist/PokeGoBR-v0.0.7-FONTE-EDITAVEL.zip dist/SHA256SUMS.txt \
            --title "PokeGoBR 0.0.7 · Scanner alfa (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK debug de testes. Corrige o seletor MediaProjection para oferecer captura de um app ou da tela inteira no Android 14+, preservando OCR local, bolha e detector V2; ainda requer testes no dispositivo. Não é versão de produção. O app requer validação em dispositivo real; a assinatura debug pode variar entre compilações." \
            --prerelease --latest=false --target "${GITHUB_SHA}"
